<div class="container py-4">
  <div class="d-flex align-items-center justify-content-between mb-4">
    <div>
      <h1 class="mb-1">Categories</h1>
      <p class="text-muted mb-0">Create and manage task categories.</p>
    </div>
  </div>

  <div class="alert alert-danger" *ngIf="errorMessage">
    {{ errorMessage }}
  </div>

  <div class="alert alert-success" *ngIf="successMessage">
    {{ successMessage }}
  </div>

  <div class="card shadow-sm mb-4">
    <div class="card-body">
      <form class="row g-3 align-items-end" (ngSubmit)="submit()">
        <div class="col-md-8">
          <label class="form-label">Category name</label>
          <input
            class="form-control"
            name="name"
            [(ngModel)]="name"
            placeholder="For example: Work, Study, Home"
          />
        </div>

        <div class="col-md-4 d-flex gap-2">
          <button class="btn btn-primary flex-fill" type="submit">
            {{ editingCategoryId ? 'Update' : 'Create' }}
          </button>

          <button
            class="btn btn-outline-secondary"
            type="button"
            *ngIf="editingCategoryId"
            (click)="cancelEdit()"
          >
            Cancel
          </button>
        </div>
      </form>
    </div>
  </div>

  <div class="card shadow-sm">
    <div class="card-body">
      <div *ngIf="isLoading" class="text-muted">
        Loading categories...
      </div>

      <div *ngIf="!isLoading && categories.length === 0" class="text-muted">
        No categories yet.
      </div>

      <div class="list-group" *ngIf="!isLoading && categories.length > 0">
        <div
          class="list-group-item d-flex align-items-center justify-content-between"
          *ngFor="let category of categories"
        >
          <div>
            <i class="bi bi-folder me-2 text-primary"></i>
            <span class="fw-semibold">{{ category.name }}</span>
          </div>

          <div class="d-flex gap-2">
            <button class="btn btn-outline-primary btn-sm" type="button" (click)="startEdit(category)">
              Edit
            </button>

            <button class="btn btn-outline-danger btn-sm" type="button" (click)="deleteCategory(category)">
              Delete
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
