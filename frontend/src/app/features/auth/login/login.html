<section class="auth-page">
  <div class="card auth-card shadow-sm">
    <div class="card-body p-4">
      <h1 class="h3 mb-3">Login</h1>
      <p class="text-muted mb-4">Sign in to manage your tasks.</p>

      <div class="alert alert-danger" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <form (ngSubmit)="submit()">
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input class="form-control" type="email" name="email" [(ngModel)]="email" required />
        </div>

        <div class="mb-3">
          <label class="form-label">Password</label>
          <input class="form-control" type="password" name="password" [(ngModel)]="password" required />
        </div>

        <button class="btn btn-primary w-100" type="submit" [disabled]="isLoading">
          {{ isLoading ? 'Signing in...' : 'Login' }}
        </button>
      </form>

      <p class="mt-3 mb-0 text-center">
        No account?
        <a routerLink="/register">Create one</a>
      </p>
    </div>
  </div>
</section>
