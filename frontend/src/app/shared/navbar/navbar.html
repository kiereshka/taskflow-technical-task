<nav class="navbar navbar-expand-lg border-bottom sticky-top app-navbar">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" [routerLink]="homeLink">
      <span class="brand-mark">
        <i class="bi bi-check2"></i>
      </span>
      <span>
        TaskFlow
        <small class="brand-subtitle d-none d-sm-block">Productivity workspace</small>
      </span>
    </a>

    <div class="d-flex align-items-center gap-1 gap-md-2 nav-cluster">
      <a class="nav-link" routerLink="/dashboard" routerLinkActive="active" *ngIf="isLoggedIn">
        <i class="bi bi-speedometer2"></i>
        Dashboard
      </a>

      <a class="nav-link" routerLink="/tasks" routerLinkActive="active" *ngIf="isLoggedIn">
        <i class="bi bi-list-check"></i>
        Tasks
      </a>

      <a class="nav-link" routerLink="/categories" routerLinkActive="active" *ngIf="isLoggedIn">
        <i class="bi bi-folder2-open"></i>
        Categories
      </a>

      <span class="user-pill d-none d-md-inline-flex" *ngIf="isLoggedIn">
        <i class="bi bi-person-circle"></i>
        {{ email }}
      </span>

      <button
        class="btn btn-outline-danger btn-sm btn-icon"
        type="button"
        *ngIf="isLoggedIn"
        (click)="logout()"
      >
        <i class="bi bi-box-arrow-right"></i>
        <span class="d-none d-sm-inline">Logout</span>
      </button>

      <a class="btn btn-outline-primary btn-sm btn-icon" routerLink="/login" *ngIf="!isLoggedIn">
        <i class="bi bi-box-arrow-in-right"></i>
        Login
      </a>
    </div>
  </div>
</nav>
